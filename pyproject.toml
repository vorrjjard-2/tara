[project]
name = "tara-ip"
version = "0.1.0"
description = "Inoculation prompting and prior association strength in a reward hacking setting"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "peft",
    "trl",
    "accelerate",
    "transformer-lens",
    "scikit-learn",
    "numpy",
    "pandas",
    "pyyaml",
    "python-dotenv",
    "tqdm",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest", "ruff", "jupyter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tara_ip"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
